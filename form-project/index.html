<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Alien Abduction Order Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <link href="forms.css" rel="stylesheet" />
  </head>
  <body>
    <div class="wrapper">
      <section>
        <h1>Projekt Order Form</h1>

        <form
          action="https://e3vwdl4bpd.execute-api.us-west-2.amazonaws.com/default/API2SES"
          method="post"
        >
          <input
            type="hidden"
            name="send_to"
            value="reza.nourozi680@gmail.com"
          />
          <fieldset>
            <legend>Contact</legend>

            <p>
              <label for="name">Namn</label>
              <input type="text" id="name" name="name" />
            </p>

            <label for="phone">Mobil number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="type your number"
            />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
          </fieldset>

          <fieldset>
            <legend>About your order!</legend>
            <label for="date">Datum</label>
            <input type="date" id="date" name="date" />

            <label for="qty">How many people would you like abducted?</label>
            <input type="number" id="qty" name="qty" min="1" max="10" />

            <p>What type of UFO do you prefer?</p>

            <label>
              <input type="radio" name="ufotype" value="classic" /> Classic oval
              UFO
            </label>

            <label>
              <input type="radio" name="ufotype" value="starwars" />
              Star Wars-style Imperial cruiser
            </label>

            <label>
              <input type="radio" name="ufotype" value="galactica" />
              Galactica-style Viper</label
            >

            <label>
              <input type="radio" name="ufotype" value="borg" />Borg-style
              cube</label
            >

            <label for="abtype"
              >What type of abduction experience do you want?</label
            >

            <select id="abtype" name="abtype">
              <option selected>Select one..</option>

              <option value="tour">Tour of the solar system</option>
              <option value="alien">Alien dinner and discussion</option>
              <option value="dance">Alien dance lessons</option>
              <option value="whale">Whale watching</option>
            </select>

            <label for="comments">Special requests:</label>
            <textarea
              id="comments"
              name="comments"
              placeholder="Tell me everything..."
            ></textarea>

            <label>
              <input
                type="checkbox"
                value="subscribe"
                name="subscribe"
                id="subscribe checked"
              />
              Add me to your email list!
            </label>
          </fieldset>

          <button type="submit">Submit</button>
        </form>
      </section>
      <aside>
        <h3>Our Location</h3>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1854900.5069449628!2d13.597863479346723!3d58.851728005802904!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x46677074a55ce9a1%3A0xc96a163f7849a3e0!2sFalun!5e0!3m2!1ssv!2sse!4v1788086785776!5m2!1ssv!2sse"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
        <address>
          Reza Universitet &middot; Norra Järnvägsgatan 20 &middot; 79135
          &middot; Falun
        </address>
      </aside>
    </div>
    <script src="js/forms.js"></script>
  </body>
</html>
